name: Sync Football Data

on:
  # Every 30 minutes during World Cup (June 11 – July 19, 2026)
  schedule:
    - cron: '*/30 * * * *'
  # Trigger manually from GitHub Actions tab or admin panel
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Sync match data from football-data.org → Firebase
        run: npx ts-node --esm scripts/sync-football.ts
        env:
          FOOTBALL_DATA_API_KEY:     ${{ secrets.FOOTBALL_DATA_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT:  ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: 'false'
